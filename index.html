<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Colorful Tic-Tac-Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #2b2d42 0%, #1e1f2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 3.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: min(100%, 550px);
            transition: all 0.2s;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            font-size: clamp(2rem, 8vw, 3.2rem);
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #fff9e6;
            text-shadow: 0 4px 0 #b45309, 0 8px 12px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        h1 span {
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.3));
        }

        .status-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0.5rem 0 1.5rem;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .turn-indicator {
            background: #fbbf24;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.5rem;
            color: #1e1b2e;
            box-shadow: 0 8px 0 #b45309, 0 10px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .turn-indicator span {
            font-size: 2rem;
            line-height: 1;
        }

        .reset-btn {
            background: #ec4899;
            border: none;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #9d174d, 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .reset-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #9d174d, 0 5px 12px rgba(0, 0, 0, 0.4);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            aspect-ratio: 1 / 1;
            width: 100%;
            margin: 1rem 0 0.5rem;
        }

        .cell {
            background: #fef9e7;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(4rem, 15vw, 6rem);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 0 #b0a58b, 0 12px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.1s ease;
            color: #2b2d42;
            user-select: none;
            aspect-ratio: 1 / 1;
            padding: 0;
            line-height: 1;
        }

        .cell:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #b0a58b, 0 8px 18px rgba(0, 0, 0, 0.4);
        }

        /* X and O colors */
        .cell[data-mark="X"] {
            color: #3b82f6;
            text-shadow: 0 6px 0 #1e3a8a;
        }

        .cell[data-mark="O"] {
            color: #ef4444;
            text-shadow: 0 6px 0 #991b1b;
        }

        /* Disable hover/active effect for filled cells */
        .cell.filled {
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 8px 0 #b0a58b, 0 12px 22px rgba(0, 0, 0, 0.4);
            filter: brightness(0.98);
        }

        .cell.filled:active {
            transform: none;
            box-shadow: 0 8px 0 #b0a58b, 0 12px 22px rgba(0, 0, 0, 0.4);
        }

        /* Winner highlight */
        .cell.winner {
            animation: pulse 1s infinite alternate;
            background: #fde68a;
            box-shadow: 0 10px 0 #b45309, 0 0 25px #fbbf24;
        }

        @keyframes pulse {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .message {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fef9e7;
            margin-top: 1.5rem;
            min-height: 3rem;
            text-shadow: 0 3px 0 #00000040;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        /* small screens */
        @media (max-width: 450px) {
            .game-container {
                padding: 1.5rem 1.2rem 2rem;
                border-radius: 2.5rem;
            }

            .turn-indicator {
                font-size: 1.2rem;
                padding: 0.5rem 1.2rem;
            }

            .turn-indicator span {
                font-size: 1.6rem;
            }

            .reset-btn {
                font-size: 1.1rem;
                padding: 0.5rem 1.4rem;
            }

            .board {
                gap: 10px;
            }

            .cell {
                border-radius: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>
            <span>🎨</span> Tic-Tac-Toe <span>✨</span>
        </h1>

        <div class="status-area">
            <div class="turn-indicator" id="turnIndicator">
                <span id="turnIcon">❌</span> <span id="turnText">Player X</span>
            </div>
            <button class="reset-btn" id="resetBtn">
                🔄 New Game
            </button>
        </div>

        <div class="board" id="board">
            <!-- 9 cells will be generated by JavaScript -->
        </div>

        <div class="message" id="message">
            ✨ X goes first! ✨
        </div>
    </div>

    <script>
        (function() {
            // ---------- GAME STATE ----------
            let board = Array(9).fill(null);          // null, 'X', or 'O'
            let currentPlayer = 'X';
            let gameActive = true;
            let winnerCombo = null;                   // array of winning indices or null

            // DOM elements
            const boardEl = document.getElementById('board');
            const turnIcon = document.getElementById('turnIcon');
            const turnText = document.getElementById('turnText');
            const messageEl = document.getElementById('message');
            const resetBtn = document.getElementById('resetBtn');
            const turnIndicator = document.querySelector('.turn-indicator');

            // winning combinations (indices)
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            // ---------- RENDER BOARD ----------
            function renderBoard() {
                // create cells if not already (or re-create for reset)
                boardEl.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.index = i;
                    cell.dataset.mark = board[i] || '';   // for styling

                    // set text content (X or O)
                    if (board[i]) {
                        cell.textContent = board[i];
                        cell.classList.add('filled');
                    } else {
                        cell.textContent = '';           // empty
                    }

                    // if this cell is part of winning combo, add winner class
                    if (winnerCombo && winnerCombo.includes(i)) {
                        cell.classList.add('winner');
                    }

                    // attach event listener
                    cell.addEventListener('click', cellClickHandler);
                    boardEl.appendChild(cell);
                }

                // update turn indicator & message after render
                updateUI();
            }

            // ---------- UPDATE UI (turn indicator & message) ----------
            function updateUI() {
                if (!gameActive) {
                    // Game over (win or draw) — message already set, but keep indicator consistent
                    if (winnerCombo) {
                        // winner is either X or O, we know from board
                        const winnerMark = board[winnerCombo[0]];
                        turnIcon.textContent = winnerMark === 'X' ? '❌' : '⭕';
                        turnText.textContent = `Player ${winnerMark} wins!`;
                        turnIndicator.style.background = winnerMark === 'X' ? '#93c5fd' : '#fca5a5';
                    } else {
                        // draw
                        turnIcon.textContent = '🤝';
                        turnText.textContent = 'Draw!';
                        turnIndicator.style.background = '#d1d5db';
                    }
                    return;
                }

                // Game active: show current player
                if (currentPlayer === 'X') {
                    turnIcon.textContent = '❌';
                    turnText.textContent = 'Player X';
                    turnIndicator.style.background = '#fbbf24';   // amber default
                } else {
                    turnIcon.textContent = '⭕';
                    turnText.textContent = 'Player O';
                    turnIndicator.style.background = '#fbbf24';
                }
            }

            // ---------- CHECK WINNER / DRAW ----------
            function checkGameState() {
                // check win
                for (let pattern of winPatterns) {
                    const [a, b, c] = pattern;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        winnerCombo = pattern;
                        gameActive = false;
                        // update message
                        messageEl.textContent = `🎉 Player ${board[a]} wins! 🎉`;
                        // re-render to apply winner styles and update UI
                        renderBoard();   // this also calls updateUI
                        return;
                    }
                }

                // check draw (no null cells)
                if (board.every(cell => cell !== null)) {
                    gameActive = false;
                    winnerCombo = null;
                    messageEl.textContent = `🤝 It's a draw! 🤝`;
                    renderBoard();  // refresh UI (no winner combos)
                    return;
                }

                // game continues — no winner yet
                winnerCombo = null;
                // message can reflect turn (optional)
                messageEl.textContent = currentPlayer === 'X' ? 
                    '✨ Player X\'s turn ✨' : '✨ Player O\'s turn ✨';
                // update turn indicator (light)
                updateUI();
            }

            // ---------- CELL CLICK HANDLER ----------
            function cellClickHandler(e) {
                const cell = e.currentTarget;
                const index = parseInt(cell.dataset.index, 10);

                // validation: game active, cell empty, no winner yet
                if (!gameActive) return;
                if (board[index] !== null) return;

                // place mark
                board[index] = currentPlayer;
                cell.dataset.mark = currentPlayer;
                cell.textContent = currentPlayer;
                cell.classList.add('filled');

                // check if game ends after this move
                const win = checkForWin();
                const draw = !win && board.every(cell => cell !== null);

                if (win) {
                    // winnerCombo already set inside checkForWin
                    gameActive = false;
                    messageEl.textContent = `🎉 Player ${currentPlayer} wins! 🎉`;
                    // re-render full board to highlight winning cells & update UI
                    renderBoard();
                    return;
                }

                if (draw) {
                    gameActive = false;
                    winnerCombo = null;
                    messageEl.textContent = `🤝 It's a draw! 🤝`;
                    renderBoard();
                    return;
                }

                // switch player
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                // update message and turn indicator
                messageEl.textContent = currentPlayer === 'X' ? 
                    '✨ Player X\'s turn ✨' : '✨ Player O\'s turn ✨';
                updateUI();   // update turn indicator
                // also update the cell's UI is already done, but we need to update UI indicator
                // also we should re-render? not necessary, but we can just update turn indicator
                // however we also want to remove any potential winner class? no winner yet.
                // But we should also make sure no stale winnerCombo exists (it is null anyway)
            }

            // helper: checks win, sets winnerCombo, returns boolean
            function checkForWin() {
                for (let pattern of winPatterns) {
                    const [a, b, c] = pattern;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        winnerCombo = pattern;
                        return true;
                    }
                }
                winnerCombo = null;
                return false;
            }

            // ---------- RESET GAME ----------
            function resetGame() {
                // reset state
                board = Array(9).fill(null);
                currentPlayer = 'X';
                gameActive = true;
                winnerCombo = null;

                // reset UI elements
                messageEl.textContent = '✨ X goes first! ✨';
                turnIndicator.style.background = '#fbbf24'; // amber

                // re-render board (this also calls updateUI)
                renderBoard();
            }

            // ---------- INITIAL RENDER ----------
            function init() {
                renderBoard();
                messageEl.textContent = '✨ X goes first! ✨';
                // ensure turn indicator shows X
                turnIcon.textContent = '❌';
                turnText.textContent = 'Player X';
                turnIndicator.style.background = '#fbbf24';

                // attach reset listener
                resetBtn.addEventListener('click', resetGame);
            }

            // start the game
            init();

            // (Optional) small fix: after a move, if no win/draw, we update turn indicator via updateUI
            // but cellClickHandler already updates turn indicator via updateUI() after switching player.
            // But we also need to re-render? not necessary for empty cells, but we want to make sure
            // that the board variable is in sync. But event listeners are on cells; we are fine.
            // However there's a subtle issue: after a move, we change textContent and classList, 
            // but if we later call renderBoard() (e.g., on win) it will re-create. That's fine.
            // Also we need to keep the UI indicator correct after draw/win — handled.

            // small improvement: after a move, remove any lingering 'winner' class? 
            // none because winnerCombo is null. But if we had a previous win and then reset, 
            // renderBoard clears it. All good.

            // Edge: when a player wins, we call renderBoard which rebuilds cells and attaches listeners.
            // That's fine, but we must ensure that the click handler doesn't cause issues.
            // Also winner combo is stored; renderBoard will add 'winner' class.

            // Also we need to update turn indicator when game ends? updateUI is called by renderBoard inside checkGameState.
            // In cellClickHandler we call renderBoard() after win/draw, which calls updateUI with correct state.
            // Perfect.

            // For draw we also call renderBoard -> updateUI shows draw.

            // One more: after switching player, we call updateUI but we don't re-render cells.
            // But the cell already has the mark and 'filled' class. No problem.

            // However, we also want to disable clicking on cells after game over: 
            // we set gameActive = false, so click handler returns early. 
            // Also filled cells have pointer-events? we have cursor not-allowed, but still clickable.
            // The click handler checks board[index] !== null and returns. So it's fine.

            // Minor: after win, we want to show winner cells highlighted. renderBoard does it.

            // Let's ensure that the 'filled' class prevents the active transform? Already done via CSS.
            // Also winner cells get pulse animation.

            // I think it's solid.
        })();
    </script>
</body>
</html>
